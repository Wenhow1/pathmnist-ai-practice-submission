[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathmnist-course-project"
version = "0.1.0"
description = "Reproducible PathMNIST model and resolution experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "torchvision>=0.20", "medmnist>=3.0", "numpy>=1.26", "scikit-learn>=1.5", "pillow>=10", "matplotlib>=3.8", "streamlit>=1.40", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
pathmnist-project = "pathmnist_project.cli:main"

[tool.setuptools.packages.find]
include = ["pathmnist_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
